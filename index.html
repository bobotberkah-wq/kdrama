<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>KDramaFlix - Stream Drama Korea VIP</title>
    <!-- FontAwesome & Google Fonts -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-primary: #07090e;
            --bg-secondary: #11141d;
            --bg-card: #181d29;
            --accent-color: #ff2a55;
            --accent-gradient: linear-gradient(135deg, #ff2a55 0%, #ff6b4a 100%);
            --text-main: #f8fafc;
            --text-muted: #94a3b8;
            --border-color: rgba(255, 255, 255, 0.06);
            --radius-lg: 16px;
            --radius-md: 12px;
            --shadow: 0 8px 24px rgba(0, 0, 0, 0.5);
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Plus Jakarta Sans', sans-serif;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            background-color: var(--bg-primary);
            color: var(--text-main);
            min-height: 100vh;
            overflow-x: hidden;
        }

        /* HEADER ELEGAN */
        .navbar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 20px 24px;
            background: linear-gradient(to bottom, rgba(7,9,14,1) 0%, rgba(7,9,14,0) 100%);
            position: sticky;
            top: 0;
            z-index: 100;
        }

        .brand-logo {
            font-size: 24px;
            font-weight: 800;
            letter-spacing: -0.5px;
            background: var(--accent-gradient);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        /* KATALOG GRID FULL */
        .catalog-container {
            padding: 0 20px 40px 20px;
            max-width: 1200px;
            margin: 0 auto;
        }

        .section-title {
            font-size: 18px;
            font-weight: 700;
            margin-bottom: 16px;
            display: flex;
            align-items: center;
            gap: 8px;
        }
        .section-title i { color: var(--accent-color); }

        .drama-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(140px, 1fr));
            gap: 16px;
        }

        /* CARD DRAMA ESTETIK */
        .drama-card {
            background: var(--bg-card);
            border-radius: var(--radius-md);
            overflow: hidden;
            cursor: pointer;
            transition: transform 0.3s cubic-bezier(0.4, 0, 0.2, 1), box-shadow 0.3s ease;
            position: relative;
            border: 1px solid var(--border-color);
            box-shadow: var(--shadow);
        }

        .drama-card:hover, .drama-card:active {
            transform: scale(1.03);
            border-color: rgba(255, 42, 85, 0.3);
        }

        .card-poster {
            position: relative;
            width: 100%;
            padding-top: 140%;
            background: #000;
        }

        .card-poster img {
            position: absolute;
            top: 0; left: 0;
            width: 100%; height: 100%;
            object-fit: cover;
            transition: opacity 0.3s;
        }

        .card-badge {
            position: absolute;
            top: 10px; right: 10px;
            background: var(--accent-color);
            color: #fff;
            font-size: 10px;
            font-weight: 800;
            padding: 4px 8px;
            border-radius: 6px;
            letter-spacing: 0.5px;
            box-shadow: 0 2px 8px rgba(255,42,85,0.4);
        }

        .card-info {
            padding: 12px;
            background: linear-gradient(to top, #181d29 0%, #181d29 100%);
        }

        .card-title {
            font-size: 13px;
            font-weight: 700;
            line-height: 1.4;
            margin-bottom: 4px;
            display: -webkit-box;
            -webkit-line-clamp: 2;
            -webkit-box-orient: vertical;
            overflow: hidden;
            color: #fff;
        }

        .card-genre {
            font-size: 11px;
            color: var(--text-muted);
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        /* ========================================================= */
        /* FULLSCREEN SHORTS PLAYER                                   */
        /* ========================================================= */
        #shortsOverlay {
            display: none;
            position: fixed;
            top: 0; left: 0;
            width: 100vw;
            height: 100vh;
            height: 100dvh;
            background: #000;
            z-index: 999999;
            overflow: hidden;
        }

        #shortsYoutubePlayer {
            width: 100%;
            height: 100%;
            position: absolute;
            top: 0; left: 0;
            border: none;
            z-index: 1;
        }

        #shortsYoutubePlayer iframe {
            width: 100%;
            height: 100%;
            border: none;
        }

        /* TOMBOL KEMBALI MELAYANG KACA */
        #floatingBackBtn {
            position: absolute;
            top: 24px;
            left: 20px;
            z-index: 1000002;
            background: rgba(20, 20, 20, 0.5);
            border: 1px solid rgba(255, 255, 255, 0.15);
            color: #fff;
            width: 42px;
            height: 42px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 16px;
            cursor: pointer;
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            transition: all 0.3s ease;
            opacity: 1;
        }

        /* Area ketuk transparan */
        #tapArea {
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            z-index: 1000000;
        }

        /* BOTTOM INFO */
        #shortsBottomInfo {
            position: absolute;
            bottom: 0; left: 0; right: 0;
            padding: 60px 24px 30px 24px;
            background: linear-gradient(to top, rgba(0,0,0,0.9) 0%, rgba(0,0,0,0.5) 50%, transparent 100%);
            z-index: 1000001;
            transition: all 0.3s ease;
            pointer-events: none;
        }

        .shorts-title {
            font-size: 20px;
            font-weight: 800;
            color: #fff;
            margin-bottom: 6px;
            text-shadow: 0 2px 4px rgba(0,0,0,0.5);
        }

        .shorts-desc {
            font-size: 13px;
            color: rgba(255,255,255,0.7);
            line-height: 1.5;
            display: -webkit-box;
            -webkit-line-clamp: 2;
            -webkit-box-orient: vertical;
            overflow: hidden;
        }

        /* TOMBOL LIKE & SHARE */
        .shorts-side-actions {
            position: absolute;
            bottom: 120px;
            right: 16px;
            display: flex;
            flex-direction: column;
            gap: 20px;
            z-index: 1000001;
            transition: all 0.3s ease;
        }

        .action-btn {
            width: 46px;
            height: 46px;
            border-radius: 50%;
            background: rgba(255, 255, 255, 0.15);
            border: 1px solid rgba(255,255,255,0.1);
            color: #fff;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            font-size: 18px;
            cursor: pointer;
            backdrop-filter: blur(8px);
            -webkit-backdrop-filter: blur(8px);
        }

        .action-btn span {
            font-size: 9px;
            font-weight: 700;
            margin-top: 2px;
        }

        /* STATE SEMBUNYI */
        .ui-hidden #floatingBackBtn,
        .ui-hidden #shortsBottomInfo,
        .ui-hidden .shorts-side-actions {
            opacity: 0;
            visibility: hidden;
            pointer-events: none;
        }

        /* OVERLAY IKLAN SHOPEE */
        .shopee-ad-overlay {
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0, 0, 0, 0.85);
            backdrop-filter: blur(8px);
            z-index: 1000005;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 16px;
            animation: fadeIn 0.3s ease;
        }

        @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }

        .shopee-ad-box {
            background: #1e2430;
            border: 1px solid rgba(238, 77, 45, 0.5);
            border-radius: var(--radius-lg);
            max-width: 320px;
            width: 100%;
            padding: 20px;
            text-align: center;
            position: relative;
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.8);
        }

        .close-ad-btn {
            position: absolute;
            top: -12px; right: -12px;
            background: #ee4d2d;
            border: none;
            color: white;
            width: 30px; height: 30px;
            border-radius: 50%;
            cursor: pointer;
            font-size: 14px;
            box-shadow: 0 4px 10px rgba(238,77,45,0.4);
        }

        .shopee-product-img { width: 100%; height: 130px; object-fit: cover; border-radius: 8px; margin: 10px 0; }
        .shopee-ad-title { font-size: 15px; font-weight: 800; color: #fff; margin-bottom: 4px; }
        .shopee-ad-desc { font-size: 12px; color: var(--text-muted); margin-bottom: 16px; }
        .btn-shopee { display: block; width: 100%; background: linear-gradient(135deg, #ee4d2d 0%, #ff7337 100%); color: #fff; text-decoration: none; padding: 12px; border-radius: 30px; font-weight: 800; font-size: 13px; }

        /* TOAST */
        #toastNotice {
            position: fixed;
            bottom: 30px;
            left: 50%;
            transform: translateX(-50%) translateY(100px);
            background: rgba(255, 255, 255, 0.1);
            backdrop-filter: blur(10px);
            color: #fff;
            padding: 12px 24px;
            border-radius: 30px;
            font-size: 13px;
            font-weight: 600;
            border: 1px solid rgba(255,255,255,0.2);
            opacity: 0;
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            z-index: 9999999;
            pointer-events: none;
        }
        #toastNotice.show { transform: translateX(-50%) translateY(0); opacity: 1; }

    </style>
</head>
<body>

<!-- HEADER & KATALOG UTAMA -->
<header class="navbar">
    <div class="brand-logo">
        <i class="fa-solid fa-clapperboard"></i> KDRAMAFLIX
    </div>
</header>

<div class="catalog-container">
    <div class="section-title">
        <i class="fa-solid fa-fire"></i> Trending Shorts Hari Ini
    </div>
    <div class="drama-grid" id="dramaGrid"></div>
</div>

<!-- FULLSCREEN SHORTS OVERLAY -->
<div id="shortsOverlay" class="ui-hidden">
    
    <!-- 1. VIDEO PLAYER FULL -->
    <div id="shortsYoutubePlayer"></div>

    <!-- 2. AREA KETUK -->
    <div id="tapArea" onclick="toggleUI()"></div>

    <!-- 3. TOMBOL KEMBALI -->
    <div id="floatingBackBtn" onclick="tutupVideoViaTombol()">
        <i class="fa-solid fa-arrow-left"></i>
    </div>

    <!-- 4. INFO BAWAH -->
    <div id="shortsBottomInfo">
        <div class="shorts-title" id="shortsTitle">Judul Drama</div>
        <div class="shorts-desc" id="shortsDesc">Sinopsis...</div>
    </div>

    <!-- 5. TOMBOL LIKE & SHARE -->
    <div class="shorts-side-actions">
        <button class="action-btn" onclick="toggleLike(this)">
            <i class="fa-solid fa-heart"></i>
            <span>Suka</span>
        </button>
        <button class="action-btn" onclick="shareLink()">
            <i class="fa-solid fa-share-nodes"></i>
            <span>Bagi</span>
        </button>
    </div>

    <!-- 6. IKLAN SHOPEE OVERLAY -->
    <div id="shopeeAdOverlay" class="shopee-ad-overlay" style="display: none;">
        <div class="shopee-ad-box">
            <button class="close-ad-btn" onclick="closeAd()"><i class="fa-solid fa-xmark"></i></button>
            <img id="adImg" class="shopee-product-img" src="https://images.unsplash.com/photo-1523275335684-37898b6baf30?q=80&w=400" alt="Produk">
            <div class="shopee-ad-title">Promo Spesial Korea!</div>
            <div class="shopee-ad-desc">Dapatkan merchandise dan snack impor favoritmu dengan diskon.</div>
            <a id="adLink" href="#" target="_blank" class="btn-shopee" onclick="closeAd()">CEK PROMO SHOPEE</a>
        </div>
    </div>
</div>

<div id="toastNotice"><i class="fa-solid fa-circle-check"></i> <span id="toastMsg">Notifikasi</span></div>

<script>
// =========================================================================
// KONFIGURASI UTAMA
// =========================================================================
const DEFAULT_SHEETS_CSV_URL = "https://docs.google.com/spreadsheets/d/e/2PACX-1vQVYkJJbDC1TpB4TzvYFzkfp4uBzYpXaqwYIARbBvqBkbtRSqz_2Olo07_tgvkwQj-Uft3CGkUvsB47/pub?output=csv"; 

// Data Fallback jika Spreadsheet gagal dimuat
let daftarDrama = [
    {
        id: "queen", title: "Queen of Tears", genre: "Romance, Drama",
        synopsis: "Kisah cinta dan dinamika pernikahan pewaris chaebol dan pengacara desa yang menghadapi krisis pelik bersama.",
        cover: "https://images.unsplash.com/photo-1518676599626-5cd8c2d678a2?q=80&w=400",
        videoId: "7XO6zMvG00g", shopeeUrl: "https://shope.ee/contoh", iklanDetik: [10]
    },
    {
        id: "lovely", title: "Lovely Runner", genre: "Time-Travel",
        synopsis: "Seorang penggemar berat kembali ke masa lalu demi menyelamatkan idola favoritnya dari tragedi masa depan.",
        cover: "https://images.unsplash.com/photo-1536440136628-849c177e76a1?q=80&w=400",
        videoId: "S6KsSUcu3Y8", shopeeUrl: "", iklanDetik: [15]
    }
];

let currentItem = null;
let adInterval = null;
let adMuncul = [];
let isVideoOpenViaHistory = false;

// =========================================================================
// HANDLING TOMBOL BACK BAWAAN HP (HISTORY API)
// =========================================================================
window.addEventListener('popstate', function(event) {
    if (isVideoOpenViaHistory) {
        tutupVideoSaja();
    }
});

// =========================================================================
// RENDER KATALOG
// =========================================================================
function renderGrid() {
    const grid = document.getElementById("dramaGrid");
    grid.innerHTML = "";
    daftarDrama.forEach(d => {
        const card = document.createElement("div");
        card.className = "drama-card";
        card.onclick = () => openShorts(d.id);
        card.innerHTML = `
            <div class="card-poster">
                <img src="${d.cover}" alt="${d.title}" loading="lazy">
                <div class="card-badge"><i class="fa-solid fa-play"></i> Shorts</div>
            </div>
            <div class="card-info">
                <div class="card-title">${d.title}</div>
                <div class="card-genre">${d.genre}</div>
            </div>
        `;
        grid.appendChild(card);
    });
}

// =========================================================================
// LOGIKA BUKA & TUTUP VIDEO
// =========================================================================
function openShorts(id) {
    const item = daftarDrama.find(d => d.id === id);
    if (!item) return;

    currentItem = item;
    adMuncul = [];
    closeAd();

    document.getElementById("shortsTitle").innerText = item.title;
    document.getElementById("shortsDesc").innerText = item.synopsis;

    const overlay = document.getElementById("shortsOverlay");
    overlay.style.display = "block";
    
    // KUNCI: Sembunyikan UI agar video langsung bersih
    overlay.classList.add("ui-hidden");
    
    document.body.style.overflow = "hidden"; 

    // Tambahkan history agar tombol back HP tidak menutup browser
    if (!isVideoOpenViaHistory) {
        history.pushState({ videoOpen: true }, "");
        isVideoOpenViaHistory = true;
    }

    // Menggunakan Iframe biasa (Bebas Error YouTube API di APK)
    const playerContainer = document.getElementById('shortsYoutubePlayer');
    playerContainer.innerHTML = ''; 
    const iframe = document.createElement('iframe');
    
    // Parameter: autoplay, rel=0 (tanpa rekomendasi), playsinline, dan cc_load_policy=0 (matikan subtitle)
    iframe.src = `https://www.youtube.com/embed/${item.videoId}?autoplay=1&rel=0&playsinline=1&cc_load_policy=0`;
    iframe.allow = "autoplay; encrypted-media; picture-in-picture";
    iframe.allowFullscreen = true;
    
    playerContainer.appendChild(iframe);

    startAdMonitor();
}

// Fungsi jika video ditutup lewat TOMBOL KACA di layar
function tutupVideoViaTombol() {
    if (isVideoOpenViaHistory) {
        history.back(); // Memicu event 'popstate' yang akan memanggil tutupVideoSaja()
    } else {
        tutupVideoSaja();
    }
}

// Fungsi inti mematikan video
function tutupVideoSaja() {
    const overlay = document.getElementById("shortsOverlay");
    overlay.style.display = "none";
    document.body.style.overflow = "auto";
    
    clearInterval(adInterval);
    closeAd();

    // Hentikan video total dengan mengosongkan iframe
    const playerContainer = document.getElementById('shortsYoutubePlayer');
    playerContainer.innerHTML = '';
    
    isVideoOpenViaHistory = false;
    currentItem = null;
}

function toggleUI() {
    document.getElementById("shortsOverlay").classList.toggle("ui-hidden");
}

// =========================================================================
// LOGIKA IKLAN SHOPEE (Timer Manual)
// =========================================================================
function startAdMonitor() {
    clearInterval(adInterval);
    let detikBerjalan = 0;
    
    adInterval = setInterval(() => {
        if (!currentItem || !currentItem.shopeeUrl) return;
        
        detikBerjalan++;
        let jadwal = currentItem.iklanDetik || [];

        for (let target of jadwal) {
            if (detikBerjalan >= target && !adMuncul.includes(target)) {
                adMuncul.push(target);
                clearInterval(adInterval);

                document.getElementById("adLink").href = currentItem.shopeeUrl;
                document.getElementById("shopeeAdOverlay").style.display = "flex";
                break; 
            }
        }
    }, 1000);
}

function closeAd() {
    document.getElementById("shopeeAdOverlay").style.display = "none";
    if (currentItem) startAdMonitor(); // Lanjutkan timer untuk iklan berikutnya
}

// =========================================================================
// FITUR TAMBAHAN (LIKE & SHARE)
// =========================================================================
function toggleLike(btn) {
    const icon = btn.querySelector("i");
    if (icon.style.color === "rgb(255, 42, 85)") {
        icon.style.color = "#fff";
        showToast("Batal suka");
    } else {
        icon.style.color = "var(--accent-color)";
        showToast("Disukai ❤️");
    }
}

function shareLink() {
    if (!currentItem) return;
    navigator.clipboard.writeText(`https://youtu.be/${currentItem.videoId}`).then(() => {
        showToast("Tautan disalin!");
    }).catch(() => {
        showToast("Gagal menyalin tautan.");
    });
}

function showToast(msg) {
    const t = document.getElementById("toastNotice");
    document.getElementById("toastMsg").innerText = msg;
    t.classList.add("show");
    setTimeout(() => t.classList.remove("show"), 2500);
}

// =========================================================================
// FETCH DATA DARI GOOGLE SPREADSHEET
// =========================================================================
function parseYT(url) {
    if (!url) return "";
    if (/^[a-zA-Z0-9_-]{11}$/.test(url)) return url;
    const m = url.match(/(?:youtu\.be\/|youtube\.com\/(?:embed\/|v\/|watch\?v=|watch\?.+&v=|shorts\/))([\w-]{11})/);
    return m ? m[1] : url;
}

async function loadSheets() {
    try {
        const res = await fetch(DEFAULT_SHEETS_CSV_URL);
        if (!res.ok) return;
        const text = await res.text();
        const lines = text.split(/\r?\n/).filter(l => l.trim() !== "");
        if (lines.length <= 1) return;

        const list = [];
        for (let i = 1; i < lines.length; i++) {
            const regex = /(?:,|\n|^)("(?:(?:"")*[^"]*)*"|[^",\n]*|(?:\n|$))/g;
            const row = [];
            let m;
            while ((m = regex.exec(lines[i])) !== null) {
                let v = m[1];
                if (v === undefined) break;
                if (v.startsWith('"') && v.endsWith('"')) v = v.substring(1, v.length - 1).replace(/""/g, '"');
                row.push(v.trim());
                if (regex.lastIndex >= lines[i].length) break;
            }
            const [id, title, genre, cover, synopsis, , vid, shopee, iklanStr] = row;
            if (!id || !title) continue;

            let iklan = [];
            if (iklanStr) iklan = iklanStr.split(',').map(n => parseInt(n.trim())).filter(n => !isNaN(n) && n > 0);
            else iklan = [30]; // Default iklan jika kolom kosong

            list.push({
                id, title, genre: genre || "K-Drama", cover, 
                synopsis: synopsis || "Sinopsis...", 
                videoId: parseYT(vid), shopeeUrl: shopee || "", iklanDetik: iklan
            });
        }
        if (list.length > 0) {
            daftarDrama = list;
            renderGrid();
        }
    } catch (e) { console.log("Error fetch:", e); }
}

// Mulai aplikasi
window.onload = () => {
    renderGrid();
    loadSheets();
};
</script>
</body>
</html>
